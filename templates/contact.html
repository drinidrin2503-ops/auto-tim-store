{% extends 'base.html' %}

{% block title %}Контакты | АвтоТим{% endblock %}

{% block content %}
<section class="page-section simple-page">
    <div class="container content-page contacts-page">
        <h1>Контакты</h1>
        <div class="contact-grid">
            <div>
                <p><strong>Email:</strong> support@autotim.ru</p>
                <p><strong>Адрес:</strong> г. Калуга, Грабцевское шоссе 20</p>
                <p><strong>Время работы:</strong> Ежедневно, 9:00–21:00</p>
            </div>
            <div class="contact-card">
                <h3>Напишите нам</h3>
                <form class="contact-form">
                    <input type="text" placeholder="Ваше имя">
                    <input type="email" placeholder="Email">
                    <textarea rows="4" placeholder="Сообщение"></textarea>
                    <button type="button" class="primary-btn">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
